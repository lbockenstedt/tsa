name: CI

# Gates the dev -> qa -> main promotion flow. `qa` and `main` require a PR, so
# without a status check those gates would verify nothing. `test` is that
# check; `dev` also runs on direct push, which contributors are allowed to make.

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ main, qa, dev ]

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap checks first (about 20 s): fleet rules, twin files (lm/docs/ci-checks.md).
  # `test` waits for them. Dev only: promotion PRs into qa/main carry commits
  # that already passed here.
  checks:
    if: (github.event_name == 'push' && github.ref_name == 'dev') || github.base_ref == 'dev'
    permissions:
      contents: read
    uses: lbockenstedt/lm/.github/workflows/fleet-rules-reusable.yml@main

  test:
    # Run when checks passed or were skipped (qa/main PRs); the first step
    # fails the job when checks failed, because a skipped required check would
    # count as passing.
    if: ${{ !cancelled() }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Stop early when an earlier job failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::error::A job this one needs failed (see 'checks'). Tests not run."
          exit 1
      - uses: actions/checkout@v4
      # No package-lock.json is committed, so there is no npm cache key.
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      # Generates the Prisma client the server code imports; needs no database.
      - name: Generate Prisma client
        run: npx prisma generate
      # Typecheck first: it is quicker than the tests and catches most breakage.
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
